name: Deploy Interactive MD-102 Study Guide to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate JSON & Script Data
        run: |
          echo "Validating HTML and JavaScript file integrity..."
          test -f index.html || (echo "index.html is missing!" && exit 1)
          test -f js/data.js || (echo "js/data.js is missing!" && exit 1)
          test -f js/app.js || (echo "js/app.js is missing!" && exit 1)
          test -f css/styles.css || (echo "css/styles.css is missing!" && exit 1)
          echo "All core assets verified successfully."

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
