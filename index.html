<script>
  // Set the theme before first paint. Without this, a reader who has chosen dark
  // gets a white flash on every load while the stylesheet and app boot.
  (function () {
    try {
      var saved = JSON.parse(localStorage.getItem("md102_state_v2") || "{}");
      if (saved.theme) document.documentElement.setAttribute("data-theme", saved.theme);
    } catch (e) {}
  })();
</script>

<header class="masthead">
  <button class="iconbtn masthead__navtoggle" type="button" data-nav-toggle aria-label="Toggle the syllabus">
    <svg class="icon"><use href="#i-menu"/></svg>
  </button>

  <a class="masthead__brand" href="#/">
    <span class="masthead__mark">102</span>
    <span>MD-102 Lab Platform</span>
  </a>

  <span class="masthead__spacer"></span>

  <div class="masthead__tools">
    <label class="field field--tenant" title="Your tenant prefix. Every UPN, script and command in every lab rewrites itself to match.">
      <svg class="icon"><use href="#i-building"/></svg>
      <input id="tenant" type="text" placeholder="contoso" aria-label="Tenant prefix" spellcheck="false" autocomplete="off">
      <span class="field__suffix">.onmicrosoft.com</span>
    </label>

    <label class="field field--search">
      <svg class="icon"><use href="#i-search"/></svg>
      <input id="search" type="search" placeholder="Search labs  /" aria-label="Search labs" autocomplete="off">
    </label>

    <a class="iconbtn" href="#/coverage" title="Objective coverage" aria-label="Objective coverage">
      <svg class="icon"><use href="#i-target"/></svg>
    </a>

    <a class="iconbtn" href="LAB_GUIDE.md" title="Offline lab guide" aria-label="Offline lab guide">
      <svg class="icon"><use href="#i-book"/></svg>
    </a>

    <button class="iconbtn" type="button" data-export title="Export progress" aria-label="Export progress">
      <svg class="icon"><use href="#i-download"/></svg>
    </button>

    <label class="iconbtn" title="Import progress" tabindex="0">
      <svg class="icon"><use href="#i-upload"/></svg>
      <input id="importFile" type="file" accept="application/json,.json" hidden>
    </label>

    <button class="iconbtn" type="button" data-reset title="Reset progress" aria-label="Reset progress">
      <svg class="icon"><use href="#i-trash"/></svg>
    </button>

    <button class="iconbtn" type="button" data-theme-toggle aria-label="Switch theme">
      <svg class="icon"><use href="#i-moon"/></svg>
    </button>
  </div>
</header>

<div class="shell">

</div>
